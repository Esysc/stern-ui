name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
            asset: stern-ui-linux-amd64
          - goos: linux
            goarch: arm64
            ext: ''
            asset: stern-ui-linux-arm64
          - goos: darwin
            goarch: arm64
            ext: ''
            asset: stern-ui-darwin-arm64
          - goos: windows
            goarch: amd64
            ext: .exe
            asset: stern-ui-windows-amd64.exe
          - goos: windows
            goarch: arm64
            ext: .exe
            asset: stern-ui-windows-arm64.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up tools (Go, Node) via mise
        uses: jdx/mise-action@v4

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build frontend (produces embedded dist/)
        run: npm run build
        working-directory: frontend

      - name: Build binary
        run: go build -trimpath -ldflags "-s -w" -o "dist/${{ matrix.asset }}" main.go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  upload-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Wait for GitHub release to be created
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
              echo "Release ${{ github.ref_name }} found"
              exit 0
            fi
            echo "Waiting for release ${{ github.ref_name }}... ($i)"
            sleep 10
          done
          echo "Release ${{ github.ref_name }} not created after 10 minutes" >&2
          exit 1

      - name: Upload binaries to release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber
